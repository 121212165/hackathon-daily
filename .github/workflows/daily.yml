name: Hackathon Daily

on:
  schedule:
    - cron: '15 22 * * *'  # 提前至 UTC 22:15 抵消 Actions 调度延迟（实测 ~1h45m），约北京 08:00 送达
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies (for tests)
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Send daily email
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_PROVIDERS: ${{ secrets.LLM_PROVIDERS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.main

      - name: Commit dedup db
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hackathons.db || true
          git diff --cached --quiet || git commit -m "chore: update dedup db [skip ci]"
          git push || true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Hackathon daily workflow failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
